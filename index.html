<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colectio Pricer</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --accent: #c8a84b;
    --accent2: #e8c870;
    --text: #e8e8e8;
    --muted: #666;
    --green: #4caf7d;
    --red: #e05252;
    --font: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
  .logo span { color: var(--text); }
  .header-actions { margin-left: auto; display: flex; gap: 8px; }

  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.7; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  main { padding: 16px; max-width: 900px; margin: 0 auto; }

  .config-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .config-bar label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .config-bar input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 14px;
    width: 140px;
  }
  .config-bar input:focus { outline: none; border-color: var(--accent); }

  .stats-bar {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    flex: 1;
    min-width: 100px;
  }
  .stat-val { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .progress-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: none;
  }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin: 8px 0; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; width: 0%; }
  .progress-text { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }

  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filter-bar input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 14px;
    flex: 1;
    min-width: 200px;
  }
  .filter-bar input:focus { outline: none; border-color: var(--accent); }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }

  .card-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    transition: border-color 0.15s;
  }
  .card-item.has-price { border-color: #2a3a2a; }
  .card-item.searching { border-color: #3a3a1a; }

  .card-name {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 8px;
    color: var(--text);
  }
  .card-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 10px;
    color: var(--muted);
  }
  .tag.parallel { color: var(--accent); border-color: #3a3010; background: #1e1a08; }
  .tag.signed { color: #7cb9e8; border-color: #102030; background: #081018; }

  .card-price {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
  }
  .price-val { font-size: 18px; font-weight: 700; color: var(--green); }
  .price-val.empty { color: var(--muted); font-size: 14px; font-weight: 400; }
  .price-src { font-size: 10px; color: var(--muted); flex: 1; }

  .debug-toggle { font-size: 10px; color: var(--muted); cursor: pointer; text-decoration: underline; }
  .debug-box {
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font-size: 10px;
    color: #7cb9e8;
    white-space: pre-wrap;
    margin-top: 6px;
    display: none;
    line-height: 1.5;
  }

  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  @media (max-width: 500px) {
    .cards-grid { grid-template-columns: 1fr; }
    .config-bar input { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">🏒 Colectio<span>Pricer</span></div>
  <div class="header-actions">
    <button class="btn btn-ghost btn-sm" id="btnStop" style="display:none">⏹ Stop</button>
    <button class="btn btn-primary" id="btnRun">Načíst & ocenit</button>
  </div>
</header>

<main>
  <div class="config-bar">
    <div>
      <label>Colectio Owner ID</label>
      <input type="text" id="ownerId" value="12187" placeholder="napr. 12187">
    </div>
    <div>
      <label>Max karet (0 = vše)</label>
      <input type="number" id="maxCards" value="10" min="0" max="9999">
    </div>
    <button class="btn btn-ghost btn-sm" id="btnTest">🧪 Test 5 karet</button>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-val" id="statTotal">—</div>
      <div class="stat-label">Karet celkem</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statPriced">—</div>
      <div class="stat-label">Oceněno</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statSkipped">—</div>
      <div class="stat-label">Bez ceny</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statAvg">—</div>
      <div class="stat-label">Průměr Kč</div>
    </div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-text">
      <span id="progressLabel">Načítám karty…</span>
      <span id="progressCount">0 / 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="filter-bar">
    <input type="text" id="filterInput" placeholder="🔍 Filtruj karty…" oninput="filterCards()">
  </div>

  <div class="cards-grid" id="cardsGrid">
    <div class="empty-state">
      <div class="icon">🃏</div>
      <p>Zadej Owner ID a klikni na Načíst & ocenit</p>
    </div>
  </div>
</main>

<script>
const USD_CZK = 23.5;
let allCards = [];
let stopFlag = false;

// ── Colectio API ──────────────────────────────────────────────────────────────
async function loadCards(ownerId, limit) {
  const cards = [];
  let page = 0;
  const perPage = 40;

  while (true) {
    const apiUrl = `https://api.colectio.com/api-public/collection/collection-item-elastic?page=${page}&perPage=${perPage}&ownerId=${ownerId}&sellable=false&sort=newestFirst&webPrefixCode=cz&primaryCurrencyId=1`;
    const url = `https://corsproxy.io/?url=${encodeURIComponent(apiUrl)}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`Colectio API ${r.status}`);
    const data = await r.json();
    const items = data.items || [];
    if (!items.length) break;

    for (const item of items) {
      const card = parseItem(item);
      if (card) cards.push(card);
      if (limit > 0 && cards.length >= limit) return cards;
    }

    if (cards.length >= data.totalItems || items.length < perPage) break;
    page++;
  }
  return cards;
}

function parseItem(item) {
  const id = String(item.itemId);
  const name = (item.name || '').trim();
  if (!name || !id) return null;

  const params = {};
  for (const p of (item.parameters || [])) params[p.name] = p.value;

  const player = params['Sportovec'] || null;
  const year   = params['Sezóna'] || null;
  const set    = params['Set'] || null;
  const cardNo = params['Číslo karty'] || null;
  const signed = params['Podpis'];
  const isAuto = signed && signed !== 'Ne' && signed !== 'Bez podpisu';

  const printRun = parsePrintRun(name, set);
  const parallel = parseParallel(name);

  return { id, name, player, year, set, cardNo, isAuto, printRun, parallel, price: null, source: null, debug: null };
}

function parsePrintRun(name, set) {
  const m = name.match(/(?:\s|^)(\d+)\/(\d+)(?:\s|$)/) || name.match(/\/(\d+)(?:\s|$)/);
  if (m) return parseInt(m[2] || m[1]);
  const n = name.toLowerCase();
  if (n.includes('future watch limited')) return 100;
  if (n.includes('future watch auto')) return 999;
  if (n.includes('future watch')) return 999;
  if (n.includes('gold spectrum')) return 10;
  if (n.includes('red spectrum')) return 25;
  if (n.includes('blue spectrum')) return 50;
  if (n.includes('spectrum')) return 25;
  if (n.includes('sunset')) return 50;
  if (n.includes('speckle')) return 25;
  if (n.includes('gold')) return 10;
  if (n.includes('purple')) return 8;
  if (n.includes('black')) return 1;
  return null;
}

function parseParallel(name) {
  const n = name.toLowerCase();
  const pars = ['future watch limited','future watch auto','future watch','gold spectrum','red spectrum','blue spectrum','spectrum','sunset','speckle','gold','purple','black','red','blue','rainbow','teal','green','orange','silver','canvas','retro'];
  for (const p of pars) if (n.includes(p)) return p;
  return null;
}

function buildQuery(card) {
  // Pro SP Authentic Future Watch - použij název série bez čísla karty
  const name = card.name || '';
  const nameLower = name.toLowerCase();
  
  // Detekuj typ karty z názvu
  let setHint = null;
  if (nameLower.includes('future watch limited')) setHint = 'Future Watch Limited';
  else if (nameLower.includes('future watch auto')) setHint = 'Future Watch Auto';
  else if (nameLower.includes('future watch')) setHint = 'Future Watch';
  else if (card.set) setHint = card.set.split(' ').slice(0,3).join(' ');

  return [
    card.player,
    card.year,
    setHint,
    card.printRun && !setHint?.includes('Future Watch') ? '/' + card.printRun : null,
    card.isAuto ? 'auto' : null,
  ].filter(Boolean).join(' ').slice(0, 100);
}

// ── eBay scraping přes CORS proxy ─────────────────────────────────────────────
async function fetchEbayPrice(card, q) {
  q = q || buildQuery(card);
  
  // eBay Browse API s Application tokenem
  const ebayToken = "v^1.1#i^1#I^3#r^0#p^1#f^0#t^H4sIAAAAAAAA/+VYe2wURRi/6wsLAlEbQBQ5tpQo9fZmd29371bu5GhLejzawh2F1kCztzvXLt3b3ezsWY4YUhtAHkYEJZrQhCZGAonPgDGIihATEy2IiglGwWj8AwkG08jrD9DZbSnXioD0iJd4/1zmm2+++X6/+R6zAzpLSmeur11/cax7VEFPJ+gscLupMaC0pLhyXGHB5GIXyFJw93RO7yzqKjw9C4kp1RAWQ2ToGoKeVSlVQ4IjDBFpUxN0ESlI0MQURIIlCbHIwgUCTQLBMHVLl3SV8ESrQwSUElyAphm/LIowgWXaNYtxPUQEJQoEOcbPsUlZlvgknkcoDaMaskTNChE0oDkv4L0UF6dYgfELgCGZAGgmPI3QRIquYRUSEGHHWcFZa2Z5enNHRYSgaWEjRDgamRurj0Sra+ris3xZtsIDLMQs0UqjoaMqXYaeRlFNw5tvgxxtIZaWJIgQ4Qv37zDUqBC55swduO8QnUjyLC/7ZU4GHM0H+JxQOVc3U6J1cz9siSJ7k46qADVLsTK3YhSzkVgJJWtgVIdNRKs99t+itKgqSQWaIaJmTqQp0tBAhON6ao5iadCLowovUnRvw+Jqr8zRbICjoN/LAIlhaUYc2Kjf2gDNw3aq0jVZsUlDnjrdmgOx13A4N3QWN1ipXqs3I0nL9ihbj7/GIedvtg+1/xTTVptmnytMYSI8zvDWJzC42rJMJZG24KCF4RMORSFCNAxFJoZPOrE4ED6rUIhosyxD8Pk6OjrIDobUzVYfDQDlW7ZwQUxqgymRcHTtXLf1lVsv8CoOFAnilUgRrIyBfVmFYxU7oLUSYQ7QvJ8d4H2oW+Hh0r8JsjD7hmZErjKE5UVWZANBlk/IMBgEuciQ8ECQ+mw/YELMeFOi2Q4tQxUlO141lE5BU5EFhk3STCAJcdgGk15/MJn0JliZ81JJCAGEiYQUDPyfEuV2Qz0GJRNaOYr1HMU5XSnRHXNraFDV1FRttcGlarTBjGVkfeW81dQSCzTJvkVtdNMSvtEfut1suCH4KlXBzMTx/rkhwM71XJFQqyMLyiOCF5N0AzboqiJl8uuAGVNuEE0rE4OqigUjAhkxjGiuanWO4P3LMnFnuHPZo/6T/nRDVMgO2fxCZa9H2IBoKKTdgUhJT/l00c51fP2wxS2O155/UByi5MMy3LAkSOK+JCdEqZ00oSjrmpoZEW8KvvnmFWsYZz8Jitx/ZSUdJkj0tIQRIz2NOUBkvX2Di+vtUMP90DJ1VYVmIzXiepBKpS0xocJ8Kww5SBBFzLNmTfEBP01xwM+MCJfktOKWfCtp/aW8qMvdcpfL+WIoqqn8wm6Yupy28Wp34ZPDN/T5I+xyflSX+zDocn9c4HaDWaCCKgfTSgqXFBXeOxkpFiQVMUkipVXD3/UmJNthxhAVs+AB1+ffflf3yIF5uzf+MrFz3XTfNte4rNeXnuVg0uD7S2khNSbrMQY8fH2mmBo/cSzNAZ7iKJbxA6YZlF+fLaImFJWdffC+7r0Xdl55aY12fvSfX1Zoe+oLwNhBJbe72IVDxWU8w27+Ysvo52pr4nsvxoVtvcTBkhM/eye9Qk88vv2oa+ev4z+JTv09tmZC5fuuxm/OvNxcb755ZunWSen7Xz2K+BW76qf+0PG4PJWffepKD+We0lJ6rK9vE7P06kczz3U/1n3pqaOvtXcteLF1xpjxYMULRb0VJb3vLLq0qUX+7XhJ2da3H/rpvfm7aivilzeik/AedfmeP77uLjvpjR569uCBHZ+tuPyVr7y1Vx5Vs7+gMr6lc3Py/OHte/ZN2bBh3Fv8tN7Z4tpPTy9ruXDq+cSHdfvObZ18pO9JVqdO72++um7nwWPhH4+80do7I1HTB+c/caTxxFm1fPWhyu/XPrpux+Wy3dENr39QAfa923+WfwFKSq3ZFxMAAA==";
  const searchUrl = `https://api.ebay.com/buy/browse/v1/item_summary/search?q=${encodeURIComponent(q)}&category_ids=212&filter=buyingOptions:{FIXED_PRICE}&sort=price&limit=20`;
  const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(searchUrl)}`;
  
  try {
    const r = await fetch(proxyUrl, {
      headers: {
        'Authorization': `Bearer ${ebayToken}`,
        'X-EBAY-C-MARKETPLACE-ID': 'EBAY_US'
      }
    });
    
    if (r.ok) {
      const data = await r.json();
      const items = data.itemSummaries || [];
      const playerLast = (card.player || '').toLowerCase().split(' ').pop();
      const prices = [];
      
      for (const item of items) {
        const title = (item.title || '').toLowerCase();
        if (playerLast && playerLast.length > 2 && !title.includes(playerLast)) continue;
        const val = parseFloat(item.price?.value || 0);
        const cur = item.price?.currency || 'USD';
        if (val > 0.1 && val < 10000) prices.push({ val, cur });
      }
      
      if (prices.length) {
        const czks = prices.filter(p => p.cur === 'CZK');
        const usds = prices.filter(p => p.cur === 'USD');
        const calcMedian = arr => { arr.sort((a,b) => a.val-b.val); return arr[Math.floor(arr.length/2)].val; };
        
        if (czks.length) {
          const m = calcMedian(czks);
          return { price: Math.round(m), source: `eBay Browse (${czks.length}x, ${m.toFixed(0)} Kč)`, query: q };
        } else if (usds.length) {
          const m = calcMedian(usds);
          return { price: Math.round(m * USD_CZK), source: `eBay Browse (${usds.length}x, $${m.toFixed(2)})`, query: q };
        }
      }
    }
  } catch(e) {
    console.warn('Browse API:', e.message);
  }
  
  return await fetchEbayRss(card, q);
}

async function fetchEbayRss(card, q) {
  try {
    const ebayRssUrl = `https://rss.ebay.com/rss2?satitle=${encodeURIComponent(q)}&sacat=212&LH_Sold=1&LH_Complete=1`;
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(ebayRssUrl)}`;
    const r = await fetch(proxyUrl);
    if (!r.ok) return null;
    const html = await r.text();

    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/xml');
    const playerLast = (card.player || '').toLowerCase().split(' ').pop();
    const prices = [];

    for (const item of doc.querySelectorAll('item')) {
      const title = (item.querySelector('title')?.textContent || '').toLowerCase();
      if (!title) continue;
      if (playerLast && playerLast.length > 2 && !title.includes(playerLast)) continue;
      const desc = item.querySelector('description')?.textContent || '';
      const fullText = title + ' ' + desc;
      const czk = fullText.match(/CZK\s*([\d,.]+)/i) || fullText.match(/([\d,.]+)\s*CZK/i);
      const usd = fullText.match(/\$([\d,.]+)/);
      if (czk) {
        const v = parseFloat(czk[1].replace(',', ''));
        if (v > 2 && v < 100000) prices.push({ val: v, cur: 'CZK' });
      } else if (usd) {
        const v = parseFloat(usd[1].replace(',', ''));
        if (v > 0.1 && v < 5000) prices.push({ val: v, cur: 'USD' });
      }
    }

    if (!prices.length) return null;
    const czks = prices.filter(p => p.cur === 'CZK');
    const usds = prices.filter(p => p.cur === 'USD');
    const calcMedian = arr => { arr.sort((a,b) => a.val-b.val); return arr[Math.floor(arr.length/2)].val; };
    if (czks.length) {
      const m = calcMedian(czks);
      return { price: Math.round(m), source: `eBay RSS (${czks.length}x, ${m.toFixed(0)} Kč)`, query: q };
    } else if (usds.length) {
      const m = calcMedian(usds);
      return { price: Math.round(m * USD_CZK), source: `eBay RSS (${usds.length}x, $${m.toFixed(2)})`, query: q };
    }
    return null;
  } catch(e) { return null; }
}

// ── Hlavní běh ────────────────────────────────────────────────────────────────
async function run(mode) {
  const ownerId = document.getElementById('ownerId').value.trim();
  if (!ownerId) { alert('Zadej Owner ID'); return; }

  stopFlag = false;
  document.getElementById('btnRun').disabled = true;
  document.getElementById('btnTest').disabled = true;
  document.getElementById('btnStop').style.display = '';
  document.getElementById('progressWrap').style.display = '';
  document.getElementById('cardsGrid').innerHTML = '';
  allCards = [];

  try {
    // 1. Načti karty
    setProgress(0, 1, 'Načítám karty z Colectio…');
    const limit = mode === 'test' ? 5 : parseInt(document.getElementById('maxCards').value) || 0;
    const cards = await loadCards(ownerId, limit);
    allCards = cards;

    // Zobraz karty
    const grid = document.getElementById('cardsGrid');
    for (const card of cards) {
      grid.appendChild(renderCard(card));
    }
    updateStats();

    // 2. Hledej ceny
    for (let i = 0; i < cards.length; i++) {
      if (stopFlag) break;
      const card = cards[i];
      setProgress(i, cards.length, `Hledám: ${card.player || card.name.slice(0,30)}…`);

      // Označ jako hledající
      const searchEl = document.getElementById('searching_' + card.id);
      if (searchEl) searchEl.innerHTML = '<span class="spinner"></span>';

      const result = await fetchEbayPrice(card);
      card.searched = true;

      if (result) {
        card.price = result.price;
        card.source = result.source;
        card.debug = `Query: "${result.query}"\nPrint run: ${card.printRun ? '/'+card.printRun : '?'}\nParallel: ${card.parallel || '—'}\neBay: ${result.price} Kč`;
      } else {
        card.debug = `Query: "${buildQuery(card)}"\nPrint run: ${card.printRun ? '/'+card.printRun : '?'}\nParallel: ${card.parallel || '—'}\neBay: nenalezeno`;
      }

      updateCardPrice(card);
      updateStats();

      // Pauza aby nebyl spam
      await new Promise(r => setTimeout(r, 1200 + Math.random() * 800));
    }

    setProgress(cards.length, cards.length, stopFlag ? 'Zastaveno' : 'Hotovo!');

  } catch(e) {
    alert('Chyba: ' + e.message);
    console.error(e);
  } finally {
    document.getElementById('btnRun').disabled = false;
    document.getElementById('btnTest').disabled = false;
    document.getElementById('btnStop').style.display = 'none';
  }
}

document.getElementById('btnRun').addEventListener('click', () => run('full'));
document.getElementById('btnTest').addEventListener('click', () => run('test'));
document.getElementById('btnStop').addEventListener('click', () => { stopFlag = true; });
</script>
</body>
</html>
